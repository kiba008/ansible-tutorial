---

- name: Basic system setup
  hosts: localhost
  connection: local
  become: true

  vars_files:
    - vars/main.yml

  tasks:

   # ---------- Base system ----------

   - name: Update apt cache
     ansible.builtin.apt:
       update_cache: true
       cache_valid_time: 3600

   - name: Install packages and keep them updated
     ansible.builtin.package:
       name: "{{ packages }}"
       state: latest

   - name: Set the system timezone
     ansible.builtin.file:
       src: "/usr/share/zoneinfo/{{ system_timezone }}"
       dest: /etc/localtime
       state: link
       force: true

   - name: Create the admin user
     ansible.builtin.user:
       name: "{{ admin_user }}"
       groups: "{{ admin_group }}"
       append: true
       shell: /bin/bash
       create_home: true

   - name: Allow the admin group access to sudo without a password
     ansible.builtin.copy:
       content: "%{{ admin_group }} ALL=(ALL) NOPASSWD: ALL\n"
       dest: /etc/sudoers.d/99-ansible
       owner: root
       group: root
       # Read access to the owner in the group, but not write access to anyone
       mode: "0440"
       validate: "visudo -cf %s"

   - name: Write a message of the day
     ansible.builtin.copy:
       content: |
         **********
         {{ ansible_facts['hostname'] }} is managed by ansible-pull
         {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
         Last applied: {{ ansible_date_time.iso8601 }}
         **********
       dest: /etc/motd
       owner: root
       group: root
       mode: "0644"

   - name: Make sure a service is enabled and running
     ansible.builtin.service:
       name: "{{ managed_service }}"
       state: started
       enabled: true

   - name: Schedule ansible-pull to run every 30 minutes
     ansible.builtin.cron:
       name: ansible-pull
       user: root
       minute: "*/30"
       # Calling ansible-pull, only run if changes are made to the repository,
       # set the repo for ansible itself
       # redirect the output to /var/log/ansible-pull.log
       job: "/usr/bin/ansible-pull -o -U {{ ansible_pull_repo }} >> /var/log/ansible-pull.log"
       cron_file: ansible-pull

   # ---------- Service packages ----------

   - name: Install service packages
     ansible.builtin.apt:
       name: "{{ service_packages }}"
       state: present

   # ---------- Fail2Ban ----------

   - name: Deploy Fail2Ban local jail config
     ansible.builtin.copy:
       dest: /etc/fail2ban/jail.local
       backup: true
       owner: root
       group: root
       mode: "0644"
       content: |
         [DEFAULT]
         ignoreip = 127.0.0.1/8 {{ lan_subnet }}
         bantime  = 1h
         findtime = 10m
         maxretry = 5

         [sshd]
         enabled = true
     notify: Restart fail2ban

   - name: Enable and start Fail2Ban
     ansible.builtin.systemd_service:
       name: fail2ban
       enabled: true
       state: started

   # ---------- Cron ----------

   - name: Enable and start cron
     ansible.builtin.systemd_service:
       name: cron
       enabled: true
       state: started

   # ---------- Samba ----------
   # smb.conf is NOT managed here, so your existing shares are untouched.

   - name: Enable and start Samba (smbd and nmbd)
     ansible.builtin.systemd_service:
       name: "{{ item }}"
       enabled: true
       state: started
     loop:
       - smbd
       - nmbd

   # ---------- Docker (official repo) ----------
   # NOTE: if this server runs Debian's docker.io package, remove this section
   # (docker-ce conflicts with docker.io). Check: dpkg -l | grep -E 'docker|containerd'

   - name: Add Docker apt repository
     ansible.builtin.deb822_repository:
       name: docker
       types: deb
       uris: https://download.docker.com/linux/debian
       suites: "{{ ansible_facts['distribution_release'] }}"
       components: stable
       architectures: amd64
       signed_by: https://download.docker.com/linux/debian/gpg
       state: present
       enabled: true

   - name: Install Docker packages
     ansible.builtin.apt:
       name: "{{ docker_packages }}"
       state: present
       update_cache: true
       cache_valid_time: 3600

   - name: Enable and start Docker and containerd
     ansible.builtin.systemd_service:
       name: "{{ item }}"
       enabled: true
       state: started
     loop:
       - containerd
       - docker

   # ---------- UFW (allow rules first, enable last) ----------
   # Ports come from vars/main.yml. Docker-published ports bypass UFW;
   # these rules cover the host itself plus host-network containers
   # (node-exporter, Syncthing).

   - name: Allow LAN TCP ports
     community.general.ufw:
       rule: allow
       proto: tcp
       port: "{{ item }}"
       src: "{{ lan_subnet }}"
     loop: "{{ ufw_lan_tcp_ports }}"

   - name: Allow LAN UDP ports
     community.general.ufw:
       rule: allow
       proto: udp
       port: "{{ item }}"
       src: "{{ lan_subnet }}"
     loop: "{{ ufw_lan_udp_ports }}"

   - name: Allow Docker networks to reach host ports (optional)
     community.general.ufw:
       rule: allow
       proto: tcp
       port: "{{ item.1 }}"
       src: "{{ item.0 }}"
     loop: "{{ docker_subnets | product(docker_subnet_ports) | list }}"

   - name: Set default deny incoming and enable UFW
     community.general.ufw:
       state: enabled
       default: deny
       direction: incoming

  handlers:
    - name: Restart fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        state: restarted

  handlers:
    - name: Restart fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        state: restarted
